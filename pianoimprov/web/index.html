<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piano Improv</title>
<style>
:root {
  --bg: #f6f3ee; --card: #fffdf9; --ink: #2b2723; --muted: #8a8178; --line: #e6dfd5;
  --accent: #7a5c3e; --accent-soft: #efe5d8; --good: #5f7f5a; --bad: #9a5b52;
  --serif: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --sans: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1916; --card: #24211d; --ink: #ece6dd; --muted: #9a9086; --line: #39342e;
          --accent: #d2b48c; --accent-soft: #3a3128; --good: #9cc092; --bad: #d99287; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.6; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; letter-spacing: .08em; margin: 0; }
h2 { font-family: var(--serif); font-weight: 500; font-size: 1.05rem; margin: 0 0 12px; letter-spacing: .05em; }
.status { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.on { background: var(--good); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.now-title { font-family: var(--serif); font-size: 1.25rem; }
.now-meta { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.chords { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 12px; }
.chord { font-size: .85rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
         transition: all .4s; }
.chord.cur { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.progress { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width 1s linear; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-size: .95rem; border: 1px solid var(--line); background: var(--card); color: var(--ink);
         padding: 9px 14px; border-radius: 10px; cursor: pointer; transition: background .15s, transform .05s; }
button:hover { background: var(--accent-soft); }
button:active { transform: scale(.97); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rate { flex: 1 1 0; min-width: 0; padding: 12px 6px; }
.rate.good { color: var(--good); } .rate.bad { color: var(--bad); }
.rate.big { font-weight: 600; }
.words { display: flex; gap: 8px; margin-top: 14px; }
.words input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
               background: var(--bg); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips button { font-size: .8rem; padding: 4px 10px; border-radius: 999px; color: var(--muted); }
.controls { margin-top: 14px; }
.taste-head { display: flex; justify-content: space-between; align-items: baseline; }
.taste-head span { color: var(--muted); font-size: .85rem; }
.param { display: grid; grid-template-columns: 9.5em 1fr; gap: 2px 12px; align-items: center; padding: 6px 0;
         border-top: 1px solid var(--line); }
.param:first-of-type { border-top: 0; }
.param .label { font-size: .9rem; }
.param .ends { grid-column: 2; display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
.param input[type=range] { width: 100%; accent-color: var(--accent); }
@media (max-width: 520px) {
  .param { grid-template-columns: 1fr; }
  .param .ends { grid-column: 1; }
}
.log { list-style: none; margin: 0; padding: 0; font-size: .85rem; max-height: 220px; overflow: auto; }
.log li { padding: 5px 0; border-top: 1px solid var(--line); color: var(--muted); }
.log li:first-child { border-top: 0; color: var(--ink); }
.log time { font-variant-numeric: tabular-nums; margin-right: 8px; opacity: .7; }
.recs { list-style: none; margin: 0; padding: 0; font-size: .85rem; }
.recs a { color: var(--accent); text-decoration: none; }
.recs li { padding: 3px 0; }
.empty { color: var(--muted); font-size: .85rem; }
.hint { color: var(--muted); font-size: .75rem; margin-top: 10px; }
.listen { width: 100%; padding: 14px; font-family: var(--serif); font-size: 1.05rem; letter-spacing: .05em;
          margin-bottom: 16px; border-color: var(--accent); }
.listen.on { background: var(--accent-soft); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
         padding: 8px 16px; border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: .92; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Piano Improv</h1>
    <a href="/character" style="margin-left:auto;margin-right:14px;font-size:13px;color:inherit;opacity:.75">弾いている姿を見る →</a>
    <div class="status"><span class="dot" id="dot"></span><span id="status">接続中…</span></div>
  </header>

  <button class="listen" id="listen">▶ このブラウザで聴く</button>
  <audio id="audio" preload="none"></audio>

  <section class="card" aria-live="polite">
    <div class="now-title" id="now-title">—</div>
    <div class="now-meta" id="now-meta">&nbsp;</div>
    <div class="chords" id="chords"></div>
    <div class="progress"><div id="progress"></div></div>

    <div class="row" style="margin-top:16px">
      <button class="rate bad" data-r="-2">かなり微妙</button>
      <button class="rate bad" data-r="-1">微妙</button>
      <button class="rate good" data-r="1">いい</button>
      <button class="rate good big" data-r="2">すごくいい</button>
    </div>

    <form class="words" id="words">
      <input id="words-text" placeholder="言葉で指示（例: もっと静かに / 雨の夜っぽく）" autocomplete="off">
      <button type="submit">伝える</button>
    </form>
    <div class="chips" id="chips"></div>

    <div class="row controls">
      <button id="pause">一時停止</button>
      <button id="next">次の曲へ</button>
      <button id="save">この曲を保存</button>
    </div>
    <div class="hint">キー操作: <kbd>+</kbd> いい ・ <kbd>-</kbd> 微妙 ・ <kbd>n</kbd> 次の曲 ・ <kbd>s</kbd> 保存 ・ <kbd>Space</kbd> 一時停止</div>
  </section>

  <section class="card">
    <div class="taste-head"><h2>いまの好み</h2><span id="taste-meta"></span></div>
    <div id="params"></div>
    <div class="hint">スライダーで直接決めることもできます（離したときに反映・次のセクションから）。</div>
  </section>

  <section class="card">
    <h2>できごと</h2>
    <ul class="log" id="log"><li class="empty">まだありません</li></ul>
  </section>

  <section class="card">
    <h2>保存した曲</h2>
    <ul class="recs" id="recs"><li class="empty">まだありません</li></ul>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const SUGGEST = ["もっと静かに", "雨の夜っぽく", "少し明るく", "ゆっくり", "印象派寄りに", "映画音楽寄りに", "3拍子で", "和風に"];
let params = [], sliders = {}, dragging = null, paused = false, lastMsgT = 0;
let listening = false, streamStart = 0, lastState = null;
const audio = $("audio");
// 配信を聴いているとき、いま耳に届いている時刻（エンジンの秒）。聴いていなければ null
function heard() { return listening && audio.currentTime > 0 ? streamStart + audio.currentTime : null; }

function toast(text) {
  const t = $("toast"); t.textContent = text; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2200);
}
async function post(path, body) {
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                  body: JSON.stringify(body || {}) });
    const j = await r.json();
    if (!r.ok) toast(j.error || "失敗しました");
    return j;
  } catch (e) { toast("サーバーにつながりません"); }
}

// ---- 好みのスライダー
async function buildParams() {
  params = await (await fetch("/api/params")).json();
  const box = $("params");
  for (const p of params) {
    const row = document.createElement("div");
    row.className = "param";
    row.innerHTML = `<label class="label" for="p-${p.name}">${p.label}</label>
      <input type="range" id="p-${p.name}" min="0" max="1" step="0.01">
      <div class="ends"><span>${p.lo}</span><span>${p.hi}</span></div>`;
    const s = row.querySelector("input");
    s.addEventListener("pointerdown", () => dragging = p.name);
    s.addEventListener("input", () => dragging = p.name);
    s.addEventListener("change", async () => {
      await post("/api/param", { name: p.name, value: parseFloat(s.value) });
      dragging = null; toast(`${p.label} を ${(+s.value).toFixed(2)} に`);
    });
    sliders[p.name] = s;
    box.appendChild(row);
  }
}

// ---- 表示の更新
function render(st) {
  paused = st.paused;
  $("dot").classList.toggle("on", !!st.current && !paused);
  $("status").textContent = paused ? "一時停止中" : st.current ? "演奏中" : "準備中…";
  $("pause").textContent = paused ? "再開" : "一時停止";

  lastState = st;
  let c = st.current;
  const h = heard();
  if (h !== null) {
    const r = st.recent.find((x) => x.start <= h && h < x.end);
    c = r ? { ...r, elapsed: h - r.start, length: r.end - r.start } : null;
  }
  if (st.listeners) $("status").textContent += ` ・ 聴いている端末 ${st.listeners}`;
  if (c) {
    $("now-title").textContent = `曲 ${c.piece} ・ ${partName(c.part)}`;
    $("now-meta").textContent = `${c.key} ・ ${c.meter}/4 ・ ♩=${c.bpm}`;
    const frac = Math.min(1, c.elapsed / c.length);
    const curIdx = Math.min(c.chords.length - 1, Math.floor(frac * c.chords.length));
    const box = $("chords");
    if (box.dataset.sig !== c.piece + c.part + c.chords.join()) {
      box.dataset.sig = c.piece + c.part + c.chords.join();
      box.innerHTML = c.chords.map((x) => `<span class="chord">${x}</span>`).join("");
    }
    [...box.children].forEach((el, i) => el.classList.toggle("cur", i === curIdx));
    $("progress").style.width = (frac * 100).toFixed(1) + "%";
  } else if (paused) {
    $("now-meta").textContent = "「再開」で新しい曲から弾きます";
    $("progress").style.width = "0";
  }

  const t = st.taste;
  $("taste-meta").textContent = `評価 ${t.n} 回 ・ 探索の幅 ${t.spread.toFixed(2)}`;
  for (const [k, v] of Object.entries(t.mu)) {
    if (sliders[k] && dragging !== k) sliders[k].value = v;
  }

  const msgs = st.messages.slice().reverse();
  if (msgs.length) {
    $("log").innerHTML = msgs.map((m) =>
      `<li><time>${new Date(m.t * 1000).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}</time>${escapeHtml(m.text)}</li>`
    ).join("");
    const newest = msgs[0];
    if (newest.t > lastMsgT) {
      if (lastMsgT) toast(newest.text);
      lastMsgT = newest.t;
      if (newest.kind === "save") loadRecs();
    }
  }
}
function partName(p) {
  return { intro: "前奏", outro: "終わり", A: "A", "A'": "A′", B: "B", "B'": "B′" }[p] || p;
}
function escapeHtml(s) {
  return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
async function loadRecs() {
  const list = await (await fetch("/api/recordings")).json();
  $("recs").innerHTML = list.length
    ? list.map((n) => `<li><a href="/recordings/${encodeURIComponent(n)}" download>${n}</a></li>`).join("")
    : '<li class="empty">まだありません</li>';
}

// ---- 操作
document.querySelectorAll(".rate").forEach((b) =>
  b.addEventListener("click", () => rate(parseFloat(b.dataset.r))));
function rate(r) { const h = heard(); post("/api/rate", h === null ? { r } : { r, at: h }); }
$("words").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("words-text").value.trim();
  if (!text) return;
  post("/api/words", { text }); $("words-text").value = "";
});
$("chips").innerHTML = SUGGEST.map((s) => `<button type="button">${s}</button>`).join("");
$("chips").querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => post("/api/words", { text: b.textContent })));
$("pause").addEventListener("click", () => post(paused ? "/api/resume" : "/api/pause"));
$("next").addEventListener("click", () => post("/api/next"));
$("save").addEventListener("click", () => post("/api/save"));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "+" || e.key === "=") rate(1);
  else if (e.key === "-") rate(-1);
  else if (e.key === "n") post("/api/next");
  else if (e.key === "s") post("/api/save");
  else if (e.key === " ") { e.preventDefault(); post(paused ? "/api/resume" : "/api/pause"); }
});

// ---- このブラウザで聴く
async function startListening() {
  const st = await (await fetch("/api/state")).json();
  streamStart = st.generated;          // 配信はこの時点で生成された音から始まる
  audio.src = "/stream?t=" + Date.now();
  listening = true;
  try { await audio.play(); } catch (e) { stopListening(); toast("再生できませんでした"); return; }
  $("listen").textContent = "■ 聴くのをやめる"; $("listen").classList.add("on");
}
function stopListening() {
  listening = false;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  $("listen").textContent = "▶ このブラウザで聴く"; $("listen").classList.remove("on");
}
$("listen").addEventListener("click", () => (listening ? stopListening() : startListening()));
audio.addEventListener("error", () => {
  if (!listening) return;
  stopListening(); toast("配信が切れました。つなぎ直します…");
  setTimeout(startListening, 2000);
});
setInterval(() => { if (listening && lastState) render(lastState); }, 1000);

// ---- 接続
function connect() {
  const es = new EventSource("/api/events");
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => { $("status").textContent = "再接続中…"; $("dot").classList.remove("on"); };
}
buildParams().then(() => { connect(); loadRecs(); });
</script>
</body>
</html>
